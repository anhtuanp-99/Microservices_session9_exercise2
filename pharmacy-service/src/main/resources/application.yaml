spring:
  application:
    name: pharmacy-service

  config:
    import: "configserver:http://localhost:8888"
    cloud:
      config:
        fail-fast: true
        retry:
          initial-interval: 1000
          max-attempts: 6
          max-interval: 2000
          multiplier: 1.5

# ===== ACTUATOR =====
management:
  endpoints:
    web:
      exposure:
        include: refresh, health, info, env, configprops
  endpoint:
    health:
      show-details: always
  health:
    refresh:
      enabled: true